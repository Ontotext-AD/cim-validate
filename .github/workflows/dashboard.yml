name: Publish dashboard

# The dashboard is built from the GraphDB validation-history graph, which only
# exists on the machine that runs the validation batch. CI therefore publishes
# the dashboard committed by `validate-all-and-write-to-gdb.sh`; it does not
# rebuild it and it does not rerun SHACL validation.

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - dashboard.css
      - dashboard/**
      - .github/workflows/dashboard.yml
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage committed dashboard
        run: |
          test -f index.html || { echo "index.html is missing; run build_dashboard_gdb.py and commit the result" >&2; exit 1; }
          test -d dashboard || { echo "dashboard/ is missing; run build_dashboard_gdb.py and commit the result" >&2; exit 1; }
          mkdir -p _site
          cp index.html dashboard.css _site/
          cp -R dashboard _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-dashboard:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish-dashboard
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
