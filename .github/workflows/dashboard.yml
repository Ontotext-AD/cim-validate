name: Build dashboard

# Builds on GitHub-hosted ubuntu-latest against the public GraphDB URL in
# dashboard-config.json (https://cim.ontotext.com/graphdb/). This does not
# rerun SHACL validation — validate.yml does that on the self-hosted runner.
# On success, or via workflow_dispatch, the staged site is published to GitHub
# Pages on this repository (https://ontotext-ad.github.io/cim-validate/).
#
# SPARQL reads use repository secrets GDBUSER and GDBPASS, passed only into the
# build step. Add both under Settings → Secrets and variables → Actions.
# Leave dashboard-config.json free of credentials. Empty secrets keep the
# requests anonymous. The repo must be public on the org free plan for Pages.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout CGMES application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/CGMES-AP
          ref: main
          path: CGMES-AP

      - name: Checkout network code application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/NC-AP
          ref: main
          path: NC-AP

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # The eval repo is checked out into relicap-ap-shacl-eval/, so
      # dashboard-config.json's ../CGMES-AP and ../NC-AP are these siblings.
      - name: Check shape checkouts
        working-directory: relicap-ap-shacl-eval
        run: |
          python3 - <<'PY'
          import dashboard_config as dc
          config = dc.load_config()
          missing = []
          for repo in config["repositories"]:
              path = repo["checkout_path"]
              print(f"{repo['id']}: {repo['checkout']} -> {path}")
              count = 0
              for family in repo.get("families") or []:
                  for directory in family.get("shacl_dirs") or []:
                      files = list((path / directory).glob("*.ttl"))
                      print(f"  {directory}: {len(files)} file(s)")
                      count += len(files)
              if count == 0:
                  missing.append(f"{repo['id']} ({repo['checkout']} -> {path})")
          if missing:
              raise SystemExit(
                  "No SHACL files in " + "; ".join(missing)
                  + ". Expected siblings ../CGMES-AP and ../NC-AP of this checkout."
              )
          PY

      - name: Build dashboard from GraphDB
        working-directory: relicap-ap-shacl-eval
        env:
          GDBUSER: ${{ secrets.GDBUSER }}
          GDBPASS: ${{ secrets.GDBPASS }}
        run: python3 build_dashboard_gdb.py

      - name: Stage dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          cp relicap-ap-shacl-eval/index.html _site/
          cp relicap-ap-shacl-eval/dashboard.css _site/
          cp -R relicap-ap-shacl-eval/dashboard _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-dashboard:
    needs: build-dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
