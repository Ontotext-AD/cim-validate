name: Build dashboard

# Runs on the self-hosted runner installed on the GraphDB host. The build reads
# the validation-history graph and the data repositories at the URLs in
# dashboard-config.json. This does not rerun SHACL validation. validate.yml
# does that, and on success it starts this workflow. workflow_dispatch
# republishes the current graph without a new batch.
#
# SPARQL reads use repository secrets GDBUSER and GDBPASS, passed only into the
# build step. Add both under Settings → Secrets and variables → Actions.
# Leave dashboard-config.json free of credentials. Empty secrets keep the
# requests anonymous.

on:
  push:
    branches:
      - multi-repo
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: self-hosted
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout CGMES application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/CGMES-AP
          ref: main
          path: CGMES-AP

      - name: Checkout network code application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/NC-AP
          ref: main
          path: NC-AP

      # The eval repo is checked out into relicap-ap-shacl-eval/, so
      # dashboard-config.json's ../CGMES-AP and ../NC-AP are these siblings.
      # A previous job left application-profiles-library here; that checkout
      # has no SHACL files unless its submodules are fetched.
      - name: Check shape checkouts
        working-directory: relicap-ap-shacl-eval
        run: |
          rm -rf ../application-profiles-library
          python3 - <<'PY'
          import dashboard_config as dc
          config = dc.load_config()
          missing = []
          for repo in config["repositories"]:
              path = repo["checkout_path"]
              print(f"{repo['id']}: {repo['checkout']} -> {path}")
              count = 0
              for family in repo.get("families") or []:
                  for directory in family.get("shacl_dirs") or []:
                      files = list((path / directory).glob("*.ttl"))
                      print(f"  {directory}: {len(files)} file(s)")
                      count += len(files)
              if count == 0:
                  missing.append(f"{repo['id']} ({repo['checkout']} -> {path})")
          if missing:
              raise SystemExit(
                  "No SHACL files in " + "; ".join(missing)
                  + ". Expected siblings ../CGMES-AP and ../NC-AP of this checkout."
              )
          PY

      - name: Debug network reachability
        run: |
          echo "--- localhost ---"
          curl -v http://localhost:7200/rest/repositories || true
          echo "--- public URL ---"
          curl -v https://cim.ontotext.com/graphdb/rest/repositories || true
          echo "--- what am I ---"
          cat /proc/1/cgroup 2>/dev/null | head -5 || true
          hostname
          
      - name: Build dashboard from GraphDB
        working-directory: relicap-ap-shacl-eval
        env:
          GDBUSER: ${{ secrets.GDBUSER }}
          GDBPASS: ${{ secrets.GDBPASS }}
        run: python3 build_dashboard_gdb.py

      - name: Stage dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          cp relicap-ap-shacl-eval/index.html _site/
          cp relicap-ap-shacl-eval/dashboard.css _site/
          cp -R relicap-ap-shacl-eval/dashboard _site/

      - name: Upload dashboard site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy-dashboard:
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download dashboard site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy static files to public repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository-name: nataschake/relicap-ap-shacl-eval-public
          branch: main
          folder: _site
          clean: true
