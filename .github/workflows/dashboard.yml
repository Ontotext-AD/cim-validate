name: Build dashboard

# Runs on the self-hosted runner installed on the GraphDB host. localhost:7200
# there is the instance that holds the validation-history graph and the
# relicapgrid data, so the build can read both. This does not rerun SHACL
# validation. After a batch, start this workflow manually (workflow_dispatch)
# to republish the pages from the graph.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-dashboard:
    runs-on: self-hosted
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout application profiles library
        uses: actions/checkout@v5
        with:
          repository: entsoe/application-profiles-library
          ref: main
          path: application-profiles-library

      - name: Debug network reachability
        run: |
          echo "--- localhost ---"
          curl -v http://localhost:7200/rest/repositories || true
          echo "--- public URL ---"
          curl -v https://cim.ontotext.com/graphdb/rest/repositories || true
          echo "--- what am I ---"
          cat /proc/1/cgroup 2>/dev/null | head -5 || true
          hostname
          
      - name: Build dashboard from GraphDB
        working-directory: relicap-ap-shacl-eval
        run: python3 build_dashboard_gdb.py

      - name: Stage dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          cp relicap-ap-shacl-eval/index.html _site/
          cp relicap-ap-shacl-eval/dashboard.css _site/
          cp -R relicap-ap-shacl-eval/dashboard _site/

      - name: Upload dashboard site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  deploy-dashboard:
    needs: build-dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download dashboard site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy static files to public repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          repository-name: nataschake/relicap-ap-shacl-eval-public
          branch: main
          folder: _site
          clean: true
