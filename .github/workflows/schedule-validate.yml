name: Schedule validation

# GitHub runs a schedule only from the default branch, and it runs that
# branch's workflow file. This job does not validate. It starts validate.yml
# on main. That run writes every configured data repository and, on success,
# starts dashboard.yml on main.
#
# validate.yml has no schedule of its own; only this workflow starts the daily
# batch.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start validate.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/dispatches" \
            -d '{"ref":"main"}'
