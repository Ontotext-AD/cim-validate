name: Validate and write to GraphDB

# Runs validate-all-and-write-to-gdb.sh on the self-hosted runner. The script
# logs in with repository secrets GDBUSER and GDBPASS, validates every
# configured SHACL file against relicapgrid, appends the runs to the history
# graph, and prunes that graph. It does not publish pages. On success this
# workflow starts "Build dashboard" (dashboard.yml), which reads the updated
# graph and deploys. Set SKIP_DASHBOARD_BUILD so the shell script does not
# generate pages that this job never uploads.
#
# Schedule is 01:00 UTC daily. GitHub runs a schedule only from the default
# branch, and only while this file is on that branch. workflow_dispatch runs
# the same job from the Actions tab. A push does not start a batch.
#
# The GraphDB account needs permission to call
# POST /rest/repositories/relicapgrid/validate/file and to write the history
# graph. Credentials stay in Actions secrets, not in dashboard-config.json.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-shacl
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout CGMES application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/CGMES-AP
          ref: main
          path: CGMES-AP

      - name: Checkout network code application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/NC-AP
          ref: main
          path: NC-AP

      # dashboard-config.json resolves ../CGMES-AP and ../NC-AP from this
      # checkout, so those siblings must exist before the batch lists files.
      - name: Check shape checkouts
        working-directory: relicap-ap-shacl-eval
        run: |
          rm -rf ../application-profiles-library
          python3 - <<'PY'
          import dashboard_config as dc
          config = dc.load_config()
          missing = []
          for repo in config["repositories"]:
              path = repo["checkout_path"]
              print(f"{repo['id']}: {repo['checkout']} -> {path}")
              count = 0
              for family in repo.get("families") or []:
                  for directory in family.get("shacl_dirs") or []:
                      files = list((path / directory).glob("*.ttl"))
                      print(f"  {directory}: {len(files)} file(s)")
                      count += len(files)
              if count == 0:
                  missing.append(f"{repo['id']} ({repo['checkout']} -> {path})")
          if missing:
              raise SystemExit(
                  "No SHACL files in " + "; ".join(missing)
                  + ". Expected siblings ../CGMES-AP and ../NC-AP of this checkout."
              )
          PY

      - name: Install validation writer dependencies
        working-directory: relicap-ap-shacl-eval
        run: |
          if python3 -m venv .venv; then
            .venv/bin/pip install -r requirements.txt
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          else
            python3 -m pip install --user -r requirements.txt \
              || python3 -m pip install --user --break-system-packages -r requirements.txt
          fi

      - name: Validate and write runs to GraphDB
        working-directory: relicap-ap-shacl-eval
        env:
          GDBUSER: ${{ secrets.GDBUSER }}
          GDBPASS: ${{ secrets.GDBPASS }}
          SKIP_DASHBOARD_BUILD: "1"
        run: ./validate-all-and-write-to-gdb.sh

      - name: Start dashboard publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
