name: Validate and write to GraphDB

# Actions → Run workflow runs this file on the branch selected in the UI.
# The daily 4:00 UTC start is schedule-validate.yml on the default branch,
# which dispatches this workflow at ref main. A push does not start a batch.
# On success this starts Build dashboard on main. The runner is Debian 10,
# and actions/setup-python has no build for that release, so the job
# downloads the Ubuntu 18.04 CPython 3.10.3 package (glibc 2.27, which
# Debian 10 can run).

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-shacl
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout CGMES application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/CGMES-AP
          ref: main
          path: CGMES-AP

      - name: Checkout network code application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/NC-AP
          ref: main
          path: NC-AP

      # setup-python matches `lsb_release` against actions/python-versions.
      # Debian 10 is not in that manifest. This 3.10.3 build is the newest
      # one there whose glibc requirement (2.27) Debian 10 satisfies.
      # The package was built for /opt/hostedtoolcache, so PYTHONHOME points
      # at this copy and LD_LIBRARY_PATH supplies libpython.
      - name: Set up Python
        run: |
          root="${RUNNER_TOOL_CACHE:-$HOME/.cache}/Python/3.10.3/x64"
          download_python() {
            rm -rf "$root"
            mkdir -p "$root"
            curl -fsSL -o "$root/python.tgz" \
              "https://github.com/actions/python-versions/releases/download/3.10.3-2000219088/python-3.10.3-linux-18.04-x64.tar.gz"
            tar -xzf "$root/python.tgz" -C "$root"
            rm -f "$root/python.tgz"
          }
          python_ok() {
            PYTHONHOME="$root" \
              LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$root/bin/python3" -c 'import encodings, os, sys; assert os.path.realpath(sys.prefix) == os.path.realpath(os.environ["PYTHONHOME"])'
          }
          if [ ! -x "$root/bin/python3" ] || ! python_ok; then
            download_python
            if ! python_ok; then
              rm -rf "$root"
              echo "Python at $root cannot import the standard library." >&2
              exit 1
            fi
          fi
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "PYTHONHOME=$root" >> "$GITHUB_ENV"

      - name: Install validation writer dependencies
        working-directory: relicap-ap-shacl-eval
        run: python3 -m pip install -r requirements.txt

      - name: Validate and write runs to GraphDB
        working-directory: relicap-ap-shacl-eval
        env:
          GDBUSER: ${{ secrets.GDBUSER }}
          GDBPASS: ${{ secrets.GDBPASS }}
          SKIP_DASHBOARD_BUILD: "1"
        run: |
          test -n "$(python3 dashboard_config.py --list-shacl)"
          python3 --version
          ./validate-all-and-write-to-gdb.sh

      - name: Start dashboard publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
