name: Validate and write to GraphDB

# Daily 14:00 UTC, and Actions → Run workflow. A push does not start a batch.
# GitHub runs the schedule only from the default branch. On success this
# starts Build dashboard on main. The runner Python has no pip, so the job
# bootstraps one into a virtual environment.

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-shacl
  cancel-in-progress: false

jobs:
  validate:
    runs-on: self-hosted
    timeout-minutes: 720
    steps:
      - name: Checkout evaluation results
        uses: actions/checkout@v5
        with:
          path: relicap-ap-shacl-eval

      - name: Checkout CGMES application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/CGMES-AP
          ref: main
          path: CGMES-AP

      - name: Checkout network code application profiles
        uses: actions/checkout@v5
        with:
          repository: entsoe/NC-AP
          ref: main
          path: NC-AP

      - name: Validate and write runs to GraphDB
        working-directory: relicap-ap-shacl-eval
        env:
          GDBUSER: ${{ secrets.GDBUSER }}
          GDBPASS: ${{ secrets.GDBPASS }}
          SKIP_DASHBOARD_BUILD: "1"
        run: |
          test -n "$(python3 dashboard_config.py --list-shacl)"
          rm -rf .venv
          python3 -m venv --without-pip .venv
          curl -sS https://bootstrap.pypa.io/get-pip.py | .venv/bin/python3
          .venv/bin/python3 -m pip install -r requirements.txt
          export PATH="$PWD/.venv/bin:$PATH"
          ./validate-all-and-write-to-gdb.sh

      - name: Start dashboard publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dashboard.yml/dispatches" \
            -d '{"ref":"main"}'
